h1:Introduction

Glory be to the Father, Son and the Holy Spirit, one true God forever and ever, Amen.

There is a journey I truly missed. The journey to Emmaus (E May us), where Jesus expounded the scriptures.

Today, I'll explore 3 old testament topics, and link them to the cross.
ip:The Sacrifice of Isaac
ip:Passover lamb
ip:Yom Kippur

h1:1. The Sacrifice of Isaac
I will draw 7 parallels here
=========
h2:1. The only sons - beloved of their fathers

Both Jesus Christ and Isaac are the only sons beloved of their fathers

At Jesus' baptism, God the father says "This is my beloved Son". Jesus is the only begotten son beloved of his Father (Ref: John 3:16, Matthew 3:17)

How about Isaac?
God tells Abraham - “Take your son, your only son Isaac, whom you love, and go to the land of Moriah. Offer him there as a burnt offering...” (Ref: Genesis 22:2)

Even though Abraham had another son Ishmael, surprisingly God calls Isaac his "Only son" -- God further qualifies saying "your only son Isaac, whom you love". This is the first time the word love is spoken in the Bible.

Isaac is the unique promised son beloved of his father

Galations (4:28) says, we are the children of promise, as Isaac was.

So, Isaac represents us. So, this Sacrifice is about us.

God says - "Your offspring will be named through Isaac." - He is the heir to Abraham (Ref: Genesis 21:12)

So, we are the heirs to the kingdom.

=========
h2:2. The Ram

God provided the ram to be sacrificed caught in a thorny bush by its horns (Ref - Genesis 22:13)

In biblical symbolism, a horn is a king (Ref - Daniel 8:20-21)

So, the king who is to be sacrificed should have his head caught in the thorns

Now, what did they do to Jesus?

And they twisted together a crown of thorns and set it on His head. They put a staff in His right hand, knelt down before Him, and mocked Him, saying, “Hail, King of the Jews!” (Ref Matthew 27:29)

They thought they were mocking him. But their words declared the truth - they put a scarlet robe (Ref - Mat 27:28) on him symbolising his stature as King and a crown of thorns just as the Ram's horns was caught in the thorns.

Isaac is us. The Ram is the innocent King. Burning as in the burnt offering is God's fury.

Let's paint a picture
- Ram with its horn caught in a thorny bush (one side)
- King Jesus in a purple robe wearing crown of thorns (other side)

=========
h2:3. The Lamb
When Isaac asked, "Where is the lamb?" Abraham answered, (Genesis 22:8) "God will provide Himself the lamb".

In Hebrew, the verse could also mean - "God will provide Himself as the Lamb"

What was in the bush (thicket) was a ram, not a lamb. So, where is the lamb?

When John the Baptist saw Jesus near Jordan, he says - “Behold, the Lamb of God, who takes away the sin of the world!" (Ref - John 1:29)

Abraham's prophecy fulfilled

=========
h2:4. Location, Location, location

Abraham named the place Yahweh-Yireh - "Yahweh will provide."

So to this day it is said, “On the mountain of the LORD it will be provided” (Ref - Genesis 22:14)

So, the Lamb of God should be provided on Mount Moriah

Where is Golgotha? on Mount Moriah

so, we sing "Evide puthran kaikalil aani tharaykkapettu, isahaakkinte kettukale chhedhichhadhum avide" - Meaning "- Where the Son’s hands were nailed, there Isaac’s bonds were severed"

What is the context of this hymn? Holy Communion. So, it is not about Isaac. We are receiving remission of sins

Jesus explains Hymn - "Most certainly I tell you, everyone who commits sin is the bondservant of sin. If therefore the Son makes you free, you will be free indeed" (Ref - John 8:34,36)

So, on the mountain, the son severed our bonds of sin and set us free. That is what the ram did.

2 Chronicles 3:1 says - Then Solomon began to build the house of the LORD in Jerusalem on Mount Moriah...

Jerusalem Temple, Golgotha, Mount Moriah, Temple mount all in Jerusalem - Most contested - piece of real estate

=========
h2:5. The three days similarity

The father and the son journeyed 3 days to the mountain (Ref - Genesis 22:4). All these 3 days, Isaac was "dead" in Abraham's heart.

Hebrews (11:19) says - "Abraham reasoned that God could raise the dead..., and in a sense, he received Isaac back from death".

So, the 3rd day Isaac came back from the dead

Ans that is us. We were dead. Death is separation from God. We are alive today because the Son rose from the dead on the 3rd day

=========
h2:6. The journey up the hill

"Abraham took the wood for the burnt offering and placed it on his son Isaac." (Genesis 22:6)

So, years before Jesus walked up the hill carrying his wooden cross, Isaac carried his wood up the same hill.

That is exactly what we sing in the hymn

yaa-gathinnaai viraku vahichonam - isahaak
tho-lil Krooshenthiya soonuvine sooji-pichu

=========
h2:7. The quiet submission to the Father

Isaac was a strong young man. He could carry all the wood on his shoulders for 3 days. Abraham was over 100 years old. Isaac could have easily fought back. But he willingly allowed himself to be bound and placed on the altar. He quietly submitted himself to his father.

What about Christ?

"He was oppressed and afflicted, yet He did not open His mouth. He was led like a lamb to the slaughter, and as a sheep before her shearers is silent, so He did not open His mouth." (Isaiah 53:7)

Not my will, but the Father's be done (Ref - Luke 22:42)

h1:2. The Passover Lamb

Here also we look at 7 parallels

h2:1. The lamb without blemish

God commands - ... On the tenth day of this month each man must select a lamb for his family, one per household. 4 Your lamb shall be without blemish, a male of the first year 6 You must keep it until the fourteenth day of the month, when the whole assembly of the congregation of Israel will slaughter the animals at twilight (Ref - Exodus 12:3-6)

By keeping the lamb in the house for four days (10th Nisan to 14th Nisan), the family could observe it closely to ensure it was absolutely perfect.

Jesus entered Jerusalem on the 10th of Nisan (which we celebrate as palm Sunday) and was "inspected" by the Pharisees, Sadducees, and Pilate for four days (until 14 Nisan - Passover day).

On the fourth day Pilate, the ruler of Jerusalem, who is vested with authority, declares, "I find no fault in him"

Pilate - authority - "I find no fault in him" - not once - not twice - 3 times - in John's Gospel. Authority - declares - lamb - perfect for sacrifice.

If you look at John's Gospel, he says that not once, not twice, but exactly three times (John 18:38, 19:4, 19:6)

He is essentially declaring that this lamb is perfect for the sacrifice

=========
h2:2. The cross
Justin Martyr (110-165) writing around 155 AD in his Dialogue with Trypho, the Jew, explains in Chapter 40:

Even the method of cooking the Passover lamb was a prophecy in action

The passover lamb is dressed up in the form of the cross
ip: 1 spit - transfixed right through from the lower parts up to the head
ip: 1 across the back - attached to the legs

So, that is a cross!!!

The passover lamb is wholly roasted - a symbol of the suffering of Christ on the cross

In ancient Israel, for the Passover, the spit was specifically required to be made of pomegranate wood. If you use a metal, it would cook the lamb from the inside

But the command was to roast it by fire, not by heated metal (Ref - Exodus 12:9)

So, the passover lamb is lifted up and roasted on a wooden cross - not boiled in a pot

Jesus says - "And I, when I am lifted up from the earth, will draw all people to myself" (Ref - John 12:32)

Romans did not invent the cross. God did

h5:The blood on the doorframe

God's command - Take a cluster of hyssop, dip it into the blood in the basin, and brush the blood on the top and sides of the doorframe (Ref - Exodus 12:22)

One strike across the lintel. One on the left and one on the right doorpost.

Picture it - They are sketching cross on the door post with the blood of the lamb.

=========
h2:3. The bones

The Law says do not break the bones of the lamb (Ref - Exodus 12:46)

Psalms says - He keeps all his bones: not one of them is broken (Ref - Psalm 34:20)

What about Jesus?

But when they came to Jesus, and saw that he was dead already, they did not break his legs: The scripture should be fulfilled, A bone of him shall not be broken (Ref- John 19:33,36)

This is choreographed by God - not one jot or one tittle shall in any wise pass from the law, until all is accomplished (Ref - Mat 5:18)

=========
h2:4. The Timing

God commanded Israel to slaughter the lamb at twilight (Ref - Exodus 12:6)

The word 'Twilight' - Hebrew word used is 'Bein ha - arbayim'. It literally means between the two evenings. The Jewish Encyclopedia (quoting Talmud) explains - "the two evenings":
The first 1st Evening: Sun begins to decline (12 PM).
The second Evening: Sunset (6 PM)

So, between 2 evenings - the exact mid-point is 3:00 PM. That is the "peak" time for sacrifice

What time did Jesus die? Jesus died at the ninth hour (3:00 PM)

Let's paint another picture
ip:1. High Priest at the Temple is blowing his shofar - signalling the Passover lamb sacrifices
ip:2. The true passover lamb cries - it is finished - and dies on the cross

Jesus replaced the Passover lamb - (Pesahayal pesahaadine neekiya mashiha modippicharuluka kripa nin pesahaayaal...)

Jesus died at the precise liturgical moment required by Law for the Lamb to be slain. This is God's doing. More precise that any clock

(Anthima pesaha hymn) - Pesaha Pesahaayil - cherthu. Neengiya pesaha - randamathethin dru-shtantham maathram

The first pesaha which is removed is only an illustration of the 2nd - the true pesaha

=========
h2:5. The Bethlehem Connection

Micah (5:2) prophesied that Jesus would be born in Bethlehem. There is a significance.

According to the Jewish Mishnah (Shekalim 7:4) - any animal found between Jerusalem and the area of Migdal Eder (near Bethlehem) was presumed to be a sacrificial animal.

So, the area around Migdal Eder is where they raise the lambs for temple sacrifice

Migdal Eder means 'Tower of the flock'. That is where levitical shepherds watched over the flocks. That is where Bethlehem is

So God announced Jesus' birth to these levitical shepherds. Here is my lamb, born to be a sacrifice

The scripture says - "... a body you prepared for me...‘Here I am - it is written about me in the scroll - I have come to do your will, my God.’" (Ref - Hebrews 10:5-7)

=========
h2:6. Egypt Connection

Micah (7:15) says - According to the days of your coming out of the land of Egypt will I show to him marvellous things.

Egypt was the blue print

Passover lamb - slain - Israel delivered from slavery in Egypt - This is our picture
True Passover lamb - slan - we are delivered from slavery - Sin, Satan and death

St. Matthew quotes Hosea 11:1 - "Out of Egypt I called My Son," - Old Israel failed in the wilderness. But, we thru Christ will inherit the Promised land

Just as Israel was brought out of Egypt with a mighty hand, we are delivered by the mighty hand of Jesus, accompanied by wonders such as the virgin birth, his death, his resurrection and the amazing power with which the church was established against the might of the Roman empire

=========
h2:7. Willing participation
All the previous 9 plagues: israel passively participated.

For example, 9th plague - Judgement on Egyption sun god. Complete darkness - no one rose from his place for ~b~3 days~b~. Darkness that could be felt. But all the children of Israel had light in their dwellings (Exodus 10:23).

So, God knew exactly where the children of Israel lived - he didn't need to see the blood on the doorpost to know where they dwelt. So, God is a message for us

The Passover lamb has been slaughtered. Blood is the one & only protection from a certain death. But, we must willingly apply

Let me paint another picture -

On the one side - Blood on the door post - applied in the shape of a cross. Israel eating the passover lamb
On the other side - a Priest giving Holy Commmunion

h2:The price of sin

When the passover lamb is kept in the house for 4 days, the children would feed it and give it a name. A bond is developed. On the fourth day, the lamb is to be slaughtered to save your life.

The tiny lamb that was alive and bleating in your house is dead to save your life. That is the price of sin. On this day, the beloved lamb in the bosom of the Father is sacrificed for our sins.

h1:3. Yom Kippur

Yom Kippur means 'The Day of Atonement'

h2:1. The Shadow of Christ's atonement

Once a year, on the Day of atonement, the Jewish High Priest enters the Holy of Holies. He offers the blood of a bull for his own sins. He then offers the blood of a lamb for the sins of the congregation.

"... those sacrifices are an annual reminder of sins, 4 because it is impossible for the blood of bulls and goats to take away sins." (Ref - Hebrews 10:3-4)

But when Christ came as a high priest..., He did not enter a man-made copy of the true sanctuary, but He entered heaven itself... He entered the Most Holy Place once for all by His own blood, thus securing eternal redemption (Ref - Hebrews 9:11-12).

Hebrews (10:1) says - "For the law is only a shadow of the good things to come..." - All sacrifices are a shadow of Christ's sacrifice

It then says (Hebrews 10:9)... "He takes away the first to establish the second." - Sacrifices are taken away and replaced by the cross.

So, we sing the hymn - Balikale neekkeedum thirubali dhanyam thaan punyam nalkeedum baliye sthothram.

Galatians (3:24) says - So the law became our guardian to lead us to Christ, that we might be justified by faith.

Today is the real atonement. So, the Law was never meant to save us. It's purpose was to lead us to Christ.

Old the Law is written on stone - external, cold, and a constant reminder of our failure.
New Law is issued. "I will put My laws in their hearts and inscribe them on their minds." (Hebrews 10:16 quoting Jeremiah 31:33)

2nd Peter: We have become partakers of divine nature - theosis.

Hebrews (10:17) quoting Jeremiah (31:34) says - “Their sins and lawless acts I will remember no more.”

=========
h2:2. The veil

on Yom Kippur, the High Priest passes through the veil that separated man from God.

When Christ Died, the thick Veil (6 metres) was torn in two - from top to the bottom (Ref - Matthew 27:51). The atonement is from above. God has made the atonement

=========
h2:3. Why the blood

Leviticus explains...the life of the flesh is in the blood, and I have given it to you upon the altar, to make atonement for your souls; for it is the blood that makes atonement for the soul. (Ref - Leviticus 17:11)

(Hebrews 9:22 - And almost all things are by the law purged with blood; and without shedding of blood is no remission.)

h1:4. Araunah's Threshing floor

2 Chronicles 3:1 - Then Solomon began to build the house of the LORD in Jerusalem on Mount Moriah, where the LORD had appeared to his father David. This was the place that David had prepared on the threshing floor of Ornan the Jebusite.

What happened at Ornan / Araunah's threshing floor? When King ~m~David sins~m~ by numbering the people (2 Samuel 24 and 1 Chronicles 21), a ~m~plague sweeps~m~ through Israel.

(~m~2 Samuel 24:16~m~) "But when the angel stretched out his hand to destroy Jerusalem, the LORD relented...At that time the angel of the LORD was by the threshing floor of Araunah the Jebusite."

(~m~2 Samuel 24:18~m~) Gad came that day to David and said to him, "Go up, build an altar to the LORD on the threshing floor of Araunah the Jebusite."

(2 Samuel 24:18-25 - ) ~m~David~m~ builds an ~m~altar~m~ and offers a ~m~sacrifice~m~. There are a few things to note here
- When the Lord saw the angel at the mountain where Jesus made the sacrifice, the Lord relented
- The ~m~fury~m~ of the Lord was ~m~satisfied by sacrifice~m~ on the same mountain
- A ~m~threshing floor~m~ is where the ~m~wheat is separated from the chaff~m~. It's Christ's sacrifice that separates the wheat from the chaff - The wheat will be gathered to his barn and the chaff burnt with unquenchable fire
- David says "I will not offer ~m~burnt offerings~m~ to the Lord my God ~m~that cost me nothing~m~," mirroring the Father’s heart
ip:The practice of tearing one's clothes upon hearing news of a death is a recurring theme in the Bible. We see that Jacob tore his clothes and mourned for Joseph. Job tore his clothes when he heard of the death of his children. David tore his clothes when he heard of the death of Saul and Jonathan... It symbolizes an "internal heart-break" made visible. Romans 8:32 says God did not spare his own Son. The veil of the temple was torn at the death of Jesus symbolizing the Father's grief.

Micah 5:2 But you, Bethlehem Ephrathah, who are small among the clans of Judah, out of you will come forth for Me One to be ruler over Israel—One whose origins are of old, from the days of eternity.
Bethlehem is located only about 5 miles (8 km) from Jerusalem.
Because of its close proximity and lush hills, Bethlehem served as the "stockyard" for the Temple.
So, Bethlehem (specifically the area known as Meegdal Eder, the "Tower of the Flock") was the primary location where sacrificial lambs for the Jerusalem Temple were raised.
The Levites and priestly shepherds managed these flocks to ensure they remained "without blemish" from birth.
Micah 4:8 And you, O watchtower of the flock, O stronghold of the Daughter of Zion—the former dominion will be restored to you; sovereignty will come to the Daughter of Jerusalem.”
Jewish tradition (specifically the Targum Yonatan) interpreted this to mean that the Messiah would be revealed at Migdal Eder in Bethlehem.

The name Beth-lehem itself is highly symbolic:
    In Hebrew: Beit Lechem means "House of Bread." (Jesus is the "Bread of Life").
    In Syriac: Beit Lahmo means "House of Meat/Flesh." (Jesus is the "Lamb" whose flesh we eat in the Eucharist).
