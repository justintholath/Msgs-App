h1:From Stone to the Soul

Let me start with a beautiful quote from St. Clement of Alexandria - "A noble hymn of God / is an immortal man, / established in righteousness, / in whom  / the oracles of truth are engraved! / For where, / but in a soul that is wise, / can you write truth?"

Paper is a dead material. A wise soul is a living, spiritual canvas where the praises of God must be written.

The most beautiful song we can offer God isn't one we sing—it is writing the truth in our hearts and living our lives fully for Christ.

St. Clement, when he wrote, "Engraving the oracles of truth": echoes Prophet Jeremiah - "I will put my laws in their minds and write them on their hearts."

In Old Testament times, Pentecost came to be celebrated as an anniversary feast of giving of the Law at Sinai. When Holy Spirit came on Pentecost, old Law is abolished and the new Law is written in our hearts. That is what St. Clement says.

===

To our human minds, having Jesus physically walking on earth seems like the ultimate scenario. When Jesus walked the earth in His physical, incarnate body, He chose to be constrained by time and space.

By ascending to the Father and sending the Paraclete - the Comforter - Jesus shifted the entire mode of His presence.



The Holy Spirit dwells inside the believer. Through the Spirit, Christ becomes an abiding, living reality inside the heart of every believer, so that, as St. Paul says, "It is no longer I who live, but Christ who lives in me."  

This is the miracle of Pentecost. The prophet Ezekiel (36:26-27) foretold this, "I will give you a new heart and put a new spirit in you; I will remove from you your heart of stone and give you a heart of flesh."

The law has shifted from Stone to the Soul. This is why Jesus told His disciples, "It is to your advantage that I go away, for if I do not go away the Comforter (Paraclete) will not come to you" (John 16:7). 

The Spirit enters human hearts, opens our spiritual eyes so that we can look at Jesus and truly see Him for who He is. As St. Paul famously wrote, "No one can say 'Jesus is Lord' except by the Holy Spirit" (1 Corinthians 12:3)

When you look closely at Jesus Christ, you are automatically seeing the Holy Spirit at work. They cannot be separated.

h1:Rebuilding of the House

Through disobedience man chose death (Gen. 2:17) instead of life. When Adam and Eve sinned, they suddenly realized they were naked and tried to cover themselves with fig leaves (Genesis 3:7). This represents humanity's futile attempt to cover their own shame and guilt through their own bare efforts. 

When we sinned, our nature became corrupt. As the Creator, only He could renew our human nature. Only the Architect could rebuild the house.

And notice what God did: The Lord God made for Adam and his wife garments of skins and clothed them (Gen 3:21). To make garments of skin, an innocent animal had to die. This was the first symbol of Christ’s ultimate sacrifice on the cross.

Think of a Loving Father and a disobedient and rebelious son. The Father loves the son too much to walk away from him!!!

God is Love. Love is relational. Relationships, community, and sharing are in His nature. Because of His relational nature, He steps out of eternity into human history and binds Himself in a covenant with our patriarch Abraham. He sent His Son to redeem and reconcile us to Himself, and at Pentecost, He pours out His Spirit to reverse our brokenness. At Babel, human pride fractured our tongues. At Pentecost, the tongues of fire united us in spirit and removed our brokenness. The final eschatological goal is to reconcile and gather us back into the eternal, loving communion of the Triune God. The divine intent is to unite us in this relationship. 

Under the Mosaic Law, sacrifices required the absolute death and destruction of the victim. 
Burnt Offering: The animal was completely reduced to ashes.
Peace or Guilt Offerings: Parts were burnt, and the remaining meat was eaten by the priests or the worshippers.
Once the animal was eaten or burned, it ceased to exist. It had a finite utility. The ritual had to be repeated endlessly, morning and evening, year after year.


Because Jesus is the eternal Logos and Life itself, death could not hold Him. Christ does not remain a dead victim. He passes through death, conquers it, and rises again.

When Christ ascends into heaven, with His own risen, glorified body. He remains the "Lamb looking as if it had been slain" (Revelation 5:6). His sacrifice is a permanent, ever-living reality in the presence of the Father.

He is "Not Only Alive, But Life-Giving": When we partake of the Holy mysteries, we are communing directly with the Risen, Living Lord.


In Him, Divinity and Humanity were united so that we could be united to Him through the Holy Spirit. When Paul describes the church as the body of Christ with Christ as its head, this is perfectly embodied.

It is through the Spirit that we are made sons and daughters, receiving the Spirit of adoption by whom we cry out, "Abba, Father!" The Spirit changes our inner disposition, infusing us with the very life of Christ.

h1:The Body in Action
The church is not an ABN number. It is not a committee or a General Body. It is the living body of Christ. It is nourished by the Holy Spirit who leads, guides, sanctifies, inspires, and builds us up.

And as a living Body, when one part faces a milestone or a need, the whole body moves together.

So it is important that we help our community as a whole.

h1:The True Light

We are the Body of Christ, and we are united to Him in the Spirit. And we cannot stand aside in a time of need. Many of us may be going through our own financial struggles right now, which is exactly why the amount is not what matters to God. What matters is that we give cheerfully. Even if it is in your heart to only give $1, remember that in the eyes of God, the widow’s mites were invaluable. What is vital is that each of us respond to the call of our Thirumeni.

Today is Pentecost. The Holy Spirit indwells in us. When we pray to God and says, "Father," it is actually the Holy Spirit echoing the eternal voice of the true Son from within our heart! When we receive the Holy Spirit, He unites us to Christ so perfectly that when the Father looks down at us, He sees the reflection of His own Radiance.

I often wondered what it all means. Sometimes when I come from inside the house into the bright Sun, the light is so blinding. And I ask myself: if the physical creation of God is this bright, how blindingly magnificent must be the True Light? No darkness can enter the Kingdom of God. How do we enter that light? This is not something we can do. Only the Holy Spirit, based on Christ’s redeeming action on the cross, can grant us communion with the Father.

And what it is like to dwell in that presence. We only know the little things that give us pleasure in this world. Proverbs 8:30 says: 
'I was that wherein he rejoiced, and daily I was glad in his presence at all times' (Prov. 8:30).
The Father finds absolute delight in the Son.
The Son finds absolute delight being in the presence of the Father.
Daily I was glad in his presence at all times - This means eternal. Eternally glad. This is where we are invited. To be eternally glad in His presence.

Let us not stand back from building His Church on earth, so that we may dwell in His heavenly tabernacle forever.

May the Holy Spirit transform us to live up to our calling. Amen.
