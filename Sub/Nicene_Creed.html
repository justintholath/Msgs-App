h1:Nicene–Constantinopolitan Symbol of Faith

h2:History

Nicaea – 325 AD
Constantinople – 381 AD
Ephesus – 431 AD

The Nicene Creed originally adopted in the synod of Nicaea was further enhanced in the second synod of constantinople. So, the version we all use is the Nicene Constantopolitan version. And the third synod of Ephesus, reaffirmed the 325 version of the Nicene Creed and declared that "it is unlawful for any man to bring forward, or to write, or to compose a different or contradictory faith as a rival to that established by the holy Fathers assembled with the Holy Ghost in Nicaea"

h2:Believe
The Nicene Creed starts with word "believe". Faith is the inevitable when we come to God and to please him. The catholic and Eastern Orthodox versions start with "I" believe, because reciting the creed is an individual expression of belief. The oriental orthodox version use 'we' believe same as the original version.

h3:We believe in one true God, the Father Almighty, Maker of heaven and earth, and of all things visible and invisible.

h2:Father

h3:Light of Light, very God of very God, begotten, not made, consubstantial with the Father;

God of God, Light of Light: 
God the Son exists in relation to God the Father. The Son is not the Father, but they both are God. The Father and Son are distinct, but both light to the world. And the Holy Spirit. Three in one. 

Scriptures have all three: Father, Son, and Holy Spirit in action at the same time at Jesus’ baptism. Scripture has the Father and Son as two as well as one. In John’s gospel, the Father and Son testify as two witnesses, not one (John 8:17-18). St. Athanasius, writing during the Nicene era, said that the Father and Son are one as "the sight of two eyes is one," probably the best analogy.

Very God of very God: God the Son is fully and utterly God, distinct but not separate from the Father.

In Him was life:There was life in Logos with respect to himself; a divine life, same with the life of the Father and of the Spirit, not by gift nor by derivation; but originally and independently, and from all eternity.

John 1 – 4 In him was life; and the life was the light of men.

Begotten, not made: Some today (Jehovah’s Witnesses) and in the past (Arians) have suggested God created Jesus.

Being of one substance with the Father: Father and Son share the same substance or essence of divinity. That is, the Father and Son both share the qualities and essential nature that make one in reality God. However, sharing the same substance does not mean they share identity of person. Although unlike the persons of the Trinity, humans do not share one will.
